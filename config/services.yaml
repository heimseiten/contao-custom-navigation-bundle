services:
    _defaults:
        autowire: true
        autoconfigure: true

    Heimseiten\ContaoCustomNavigationBundle\:
        resource: '../src/'
        exclude: '../src/{HeimseitenContaoCustomNavigationBundle.php,ContaoManager}'

    Heimseiten\ContaoCustomNavigationBundle\Twig\CustomNavigationRuntime:
        arguments:
            $assetVersion: '%heimseiten_custom_navigation.asset_version%'
